[pytest]
testpaths = tests
# Project modules (game, market, ...) and test helpers (wsutil) import by plain name.
pythonpath = . tests
addopts = -ra
filterwarnings =
    # anyio 3.7 (pinned via fastapi) trips a Python 3.14 syntax warning; not our code.
    ignore:'return' in a 'finally' block:SyntaxWarning
